spring.application.name=competitive-programming-tracker

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/competitive_programming_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Noob1290@#}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
# Override in production with JWT_SECRET (32+ characters).
app.jwt.secret=${JWT_SECRET:CompetitiveProgrammingTrackerSecretKey2026ForDevelopmentOnly}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://localhost:5173,http://127.0.0.1:5173}

server.port=${PORT:${SERVER_PORT:8080}}

# Development admin bootstrap. Leave empty in production.
app.admin.bootstrap-username=${ADMIN_BOOTSTRAP_USERNAME:}

logging.level.Competitive.Programming.Tracker.security=INFO
